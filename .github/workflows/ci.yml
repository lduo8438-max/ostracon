name: CI

# 「不放寬 CI 閘門」是專案規則之一（見 CLAUDE.md），但規則要有東西在執行才算數。
# 這個 workflow 就是那個東西：型別檢查、單元測試、兩套黃金測試集的逐案例迴歸比對。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # **fetch-depth: 0 是必要的，不是保險。** actions/checkout 預設只抓 1 個
      # commit，而淺層 clone 的截斷點會被索引器當成「誕生」——所以索引器現在
      # 直接拒絕淺層 repo，下面的封裝冒煙測試會對本 workspace 跑一次 why。
      # 在加上這道偵測之前，那個冒煙測試一直在對一段截斷過的歷史跑。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # **這一步必須在最前面。** 沒有 FTS5 的話整個 schema 建不起來，而 SQLite
      # 只會回 `no such module: fts5`——那個訊息不會告訴任何人原因。
      # 與其讓後面的步驟以難懂的方式崩掉，不如在這裡明確失敗。
      - name: 檢查內建 SQLite 是否含 FTS5
        run: |
          node -e "new (require('node:sqlite').DatabaseSync)(':memory:').exec('CREATE VIRTUAL TABLE t USING fts5(x)')" \
            || { echo "::error::這個 Node build 的內建 SQLite 沒有 FTS5，完整 schema 建不起來"; exit 1; }
          node -v

      - run: pnpm install --frozen-lockfile

      # 與 pnpm test 重複跑一次 tsc，是為了讓「型別錯誤」與「測試失敗」在
      # CI 介面上是兩個分開的紅點。多花幾秒換到的是可讀性。
      - name: 型別檢查（零錯誤是硬門檻）
        run: pnpm typecheck

      - name: 單元測試
        run: pnpm test

      # 語料座標（clone_url + index_until）的唯一真相在 fixture 裡。CI 不另外抄一份
      # SHA——抄了就會有兩份、遲早分岔，而且沒有人會發現。corpus:fetch 會驗證
      # 取回的 HEAD 確實等於 fixture 指定的 commit，不符就硬失敗。
      - name: 取得語料（座標讀自 fixture）
        run: pnpm corpus:fetch -- --dir "$RUNNER_TEMP/corpora"

      # 迴歸閘門是**逐案例**比對 baseline，不比對彙總率：覆蓋率上升時本來 missing
      # 的案例會開始被評估、其中一部分必然 fail，那是新資訊不是退步。
      # 只有「baseline 裡 pass 的案例變成 fail 或 missing」才會讓這一步失敗。
      - name: 黃金測試集 — Osiris
        run: |
          pnpm golden:index -- --repo "$RUNNER_TEMP/corpora/osiris" \
            --fixture fixtures/osiris.yaml --db "$RUNNER_TEMP/osiris.db"
          pnpm golden -- --fixture fixtures/osiris.yaml \
            --db "$RUNNER_TEMP/osiris.db" \
            --baseline fixtures/baselines/osiris.json \
            --report "$RUNNER_TEMP/golden-osiris.json"

      # 搬移守門只有在真實語料上才守得住：它要分辨「內容搬到別的檔案」與
      # 「內容真的離開了 repo」，而受控 repo 造不出跨越多個子專案的搬移。
      # 代價是這一步要 clone 1,378 個 commit 並跑全 repo pass（約 15 秒）。
      - name: 黃金測試集 — create-t3-app（搬移守門）
        run: |
          pnpm golden:index -- --repo "$RUNNER_TEMP/corpora/create-t3-app" \
            --fixture fixtures/create-t3-app.yaml --db "$RUNNER_TEMP/t3.db"
          pnpm golden -- --fixture fixtures/create-t3-app.yaml \
            --db "$RUNNER_TEMP/t3.db" \
            --baseline fixtures/baselines/create-t3-app.json \
            --report "$RUNNER_TEMP/golden-t3.json"

      # Osiris 與 create-t3-app 在好幾個指標上剛好落在同一側，於是一整類缺陷可以
      # 活很久：兩套的理由全在單行主旨上（硬換行截斷 0%，而 vuejs/core 是 24.2%）、
      # 兩套幾乎沒有「宣告死而復生」的形狀（`death_commit_id` 停在第一次死亡的
      # 缺陷在它們身上是 0 與 1 筆，vuejs/core 是 176 筆）。這一步就是補那一側。
      #
      # `index_until` 釘在 topo 900 而不是 HEAD：要釘的現象都在早期，而且這份
      # fixture 沒有 excursion 案例，所以 golden:index 不跑全 repo pass——實測
      # 0.7 秒。閘門的價值來自它擋不擋得下退步，不是來自索引了多少歷史。
      - name: 黃金測試集 — vuejs/core（另一側的語料）
        run: |
          pnpm golden:index -- --repo "$RUNNER_TEMP/corpora/vue-core" \
            --fixture fixtures/vue-core.yaml --db "$RUNNER_TEMP/vue.db"
          pnpm golden -- --fixture fixtures/vue-core.yaml \
            --db "$RUNNER_TEMP/vue.db" \
            --baseline fixtures/baselines/vue-core.json \
            --report "$RUNNER_TEMP/golden-vue.json"

      # **在這一步之前，整道閘門只有 TypeScript 語料。** W5 加 Python 的論點是
      # 「加新語言＝新增一份剖面，匹配器／雜湊／圖遍歷／增量索引一處都不動」，
      # 而那個論點原本只有一次手跑 psf/requests 的量測撐著——不可重跑、不進 CI。
      # 剖面被改壞的話，四套 TypeScript 語料逐位元不變，閘門一聲不響。
      #
      # 四條案例都驗過會咬：把 `comment` 移出 commentTypes → 註解案例 raw 變 shape；
      # 把 `string` 加進去 → docstring 案例 alpha 變 raw；拿掉 alpha_self 的自身
      # 名稱正規化 → 改名案例 L3b 掉到 L4；拿掉 class_definition → 方法失去類別名
      # 前綴，兩條案例直接 missing。
      #
      # `index_until` 釘在 1,744 個 commit；lineage 與 change_level 案例只需要
      # 錨點檔案，實測 materialize 2.8 秒。
      - name: 黃金測試集 — psf/requests（Python 剖面）
        run: |
          pnpm golden:index -- --repo "$RUNNER_TEMP/corpora/requests" \
            --fixture fixtures/requests.yaml --db "$RUNNER_TEMP/requests.db"
          pnpm golden -- --fixture fixtures/requests.yaml \
            --db "$RUNNER_TEMP/requests.db" \
            --baseline fixtures/baselines/requests.json \
            --report "$RUNNER_TEMP/golden-requests.json"

      - name: 黃金測試集 — 受控 fixture
        run: |
          pnpm golden:index -- --repo "$RUNNER_TEMP/corpora/controlled-typescript" \
            --fixture fixtures/controlled-typescript.yaml \
            --db "$RUNNER_TEMP/controlled.db"
          pnpm golden -- --fixture fixtures/controlled-typescript.yaml \
            --db "$RUNNER_TEMP/controlled.db" \
            --baseline fixtures/baselines/controlled-typescript.json \
            --report "$RUNNER_TEMP/golden-controlled.json"

      # 建置壞掉不會被上面任何一步發現——開發與測試都走 strip-types，不碰 tsc emit。
      # 所以要在這裡真的打包一次、在封裝外安裝、實際執行，證明發布出去的東西能跑。
      - name: 建置並冒煙測試封裝
        run: |
          pnpm run build
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/pkg" && cd "$RUNNER_TEMP/pkg"
          npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE"/ostracon-*.tgz
          ./node_modules/.bin/ostracon --version
          # 完整跑一次 why：這會驗到 db/schema.sql 與 tree-sitter wasm
          # 在「安裝後的位置」解析得到——在原始碼樹裡跑是驗不到的。
          #
          # **schema 的相對路徑是這一步真正在守的東西。** 讀 schema 的程式碼
          # 從 `cli/` 搬到 `git/persist.ts` 過一次，而 `../../db/schema.sql`
          # 在 `dist/` 裡的深度剛好不變——那是巧合不是保證，下次搬就未必。
          ./node_modules/.bin/ostracon why 'src/match/signature.ts:modMulAdd' \
            --repo "$GITHUB_WORKSPACE" --db "$RUNNER_TEMP/smoke.db" \
            | grep -q modMulAdd
          # 每一支子指令都要有人走過一次：`why` 走的是快路徑，`hotspots` 走的是
          # 全 repo pass，兩者的失敗方式不同（前者不會碰 indexRepoStructure）。
          ./node_modules/.bin/ostracon hotspots \
            --repo "$GITHUB_WORKSPACE" --db "$RUNNER_TEMP/smoke-hot.db" --limit 5 \
            | grep -q '次結構改動'

      # 失敗時要看得到是哪幾條案例退步，而不是只有一個 exit code。
      - name: 保留黃金測試集報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-reports
          path: ${{ runner.temp }}/golden-*.json
          if-no-files-found: ignore
