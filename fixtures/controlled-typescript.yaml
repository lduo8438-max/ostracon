  - id: ctrl-non-ascii-path-move
    kind: lineage
    difficulty: hard
    label_confidence: certain
    rationale: >
      把 src/legacy.ts 原封不動改名成 src/票券解析.ts，內容一個 token 都沒改。
      git 預設 core.quotePath=true，所以 --name-status 會把新路徑輸出成
      "src/\347\245\250\345\210\270\350\247\243\346\236\220.ts"。走訪層若不去引號，
      路徑會帶著引號與八進位逸出存進 file_change 與 path_lineage_segment，
      而副檔名判定看到的是 `.ts"`——於是那一版根本不會被解析，這個案例會變成
      missing 而不是 fail。實測未修正前 revision 數為 0。

      一個案例同時守住三件事：非 ASCII 檔案有沒有被解析；R 記錄的新舊路徑是否
      都去引號（只去一邊血緣就接不起來）；以及血緣有沒有跨過改名——接不起來會
      產生一個假死亡，而假死亡再餵給迂迴偵測就變成假的「被推翻」。

      內容完全未變且同名，所以正確答案是 L1：這是最強的規則，不得退到相似度層。
    chain:
      - anchor:
          commit: 1c23617de66dd2942bd08964bd32b77391e107b5
          path: src/legacy.ts
          symbol: resolveTicket
          occurrence: 0
          snippet_head: "function resolveTicket(input: string): string {"
      - anchor:
          commit: ad95f7aa4dc964307f149e25fbb1edfa24faae27
          path: src/票券解析.ts
          symbol: resolveTicket
          occurrence: 0
          snippet_head: "function resolveTicket(input: string): string {"
        transition:
          type: move
          expect_tier_at_most: L1

  # ── 中文 commit message ───────────────────────────────────────────────────
  #
  # 兩套黃金語料（Osiris、create-t3-app）都是英文，所以抽取器宣稱的中英並列
  # 只有英文那一半被驗過。這四條把中文那一半補上。

  - id: evd-zh-negation-outside-span
    kind: evidence
    difficulty: adversarial
    label_confidence: certain
    at_commit: a1450f05e05be7f927b052faa70a393848600669
    expect_spans: []
    rationale: >
      原文是「所以版本字串沒有理由改變。」。裸的「理由」當標記時會抽出
      「理由改變。」——否定詞留在 span 外面，逐字為真、span 斷言通過、
      意思剛好相反。**span 斷言擋不住這一類**，所以必須由 fixture 擋。
      這是整組案例裡最重要的一條：它守的是誠信，不是覆蓋率。

  - id: evd-zh-marker-mid-word
    kind: evidence
    difficulty: adversarial
    label_confidence: certain
    at_commit: 8b2cfdced0789fae462f25dbe657b4cc81f3845a
    expect_spans: []
    rationale: >
      「真理由 87」與「判斷理由是不是」裡的「理由」是別的詞的後半段。
      中文沒有詞界而標記是用 indexOf 配的，引文會從詞中間開始。
      名詞標記要求冒號（理由：／原因：）之後這則訊息不得產出任何引文。

  - id: evd-zh-colon-marker
    kind: evidence
    difficulty: hard
    label_confidence: certain
    at_commit: 7a92ab3783902575a85d055026a7f11df8455bea
    expect_spans:
      - source: {type: commit_message}
        contains: "理由：Myers 的 hunk 邊界不穩定。"
        tier: stated
    rationale: >
      名詞標記帶冒號時是真的引導語，與英文的 reason: / why: 同一個形狀。
      這是前兩條負例的價格標籤：收緊詞界不得把合法的中文理由一起殺掉。

  - id: evd-zh-conjunction-after-han
    kind: evidence
    difficulty: hard
    label_confidence: certain
    at_commit: 464a245ba611511eac15f1e0298b6e18feeb9671
    expect_spans:
      - source: {type: commit_message}
        contains: "因為偵測器看不到內容搬去的那個檔案。"
        tier: stated
    rationale: >
      「這是因為……」接在漢字後面是合法中文。實測「前一字不得是漢字」這條
      泛用規則代價 1 條、收益 0 條，已否決；這條案例守住它不會被重新引入。

  # ── 死而復生 ───────────────────────────────────────────────────────────────
  #
  # `entity.death_commit_id` 是衍生欄位。原本兩個 pass 在寫死亡時就地更新且帶著
  # `AND death_commit_id IS NULL`，於是死亡點永遠停在第一次——實測 vuejs/core
  # 有 176 個 entity（10.8%）的死亡點早於它自己最後一個 revision，連帶產生
  # 44 條假的 A 級迂迴。兩套既有的黃金語料都沒有這個形狀。
  - id: ctrl-revived-second-removal
    kind: excursion
    difficulty: hard
    entity: {path: src/revived.ts, symbol: retryOnce}
    expect: present
    introduce_at: 87114bf1dcd244ea61186df645587256674f0724
    remove_at: f359ecde08affacaa81a8d543f6e88a7b736b275
    expect_strength_at_least: A
    rationale: >
      retryOnce 被移除（127500a8）之後又一字不差地加回來（87114bf1），
      最後才真正移除（f359ecde）。第二段生命週期必須自己成立，
      而不是繼承第一次的死亡點——那正是 vuejs/core 上假迂迴的來源。
